[project]
name = "ble-bridge"
version = "0.1.0"
description = "WebSocket relay for browser E2E tests against real BLE hardware"
requires-python = ">=3.12"
dependencies = [
    "bleak-esphome>=4.0.0",
    "websockets>=14.0",
]

[project.scripts]
ble-bridge = "ble_bridge.__main__:main"

[dependency-groups]
# `mcp` is the MCP shim's dependency, not the bridge's. It is here so
# tests/test_mcp_shim.py can load ../mcp-server/ble_mcp.py and drive it against a
# real control socket; nothing under src/ imports it, and the bridge runs without
# it. Pinned to match the shim's PEP 723 block exactly -- two pins that can drift
# would let the suite pass against a version the shim never runs on.
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mcp==2.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ble_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
