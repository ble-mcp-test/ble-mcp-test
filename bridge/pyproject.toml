[project]
name = "ble-bridge"
version = "0.1.0"
description = "WebSocket relay for browser E2E tests against real BLE hardware"
requires-python = ">=3.12"
dependencies = [
    "bleak-esphome>=4.0.0",
    "websockets>=14.0",
]

[project.scripts]
ble-bridge = "ble_bridge.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ble_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
