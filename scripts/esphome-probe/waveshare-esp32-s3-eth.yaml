# Waveshare ESP32-S3-ETH (with or without PoE) as an ESPHome Bluetooth Proxy.
#
# Why this board: USB-C flashing (no serial wiring), W5500 ethernet so WiFi stays
# off the BLE radio, external-antenna variant available, usually on Amazon Prime.
# ESP32-S3 = BLE 5 only (no classic BT) — fine, we only need BLE.
#
#   uvx esphome run scripts/esphome-probe/waveshare-esp32-s3-eth.yaml
#
# W5500 pinout from kiler129/ESP32-S3-ETH-bt-proxy (community-verified):
#   MOSI 11, MISO 12, CLK 13, CS 14, RESET 9, INT 10.

esphome:
  name: waveshare-s3-eth-probe
  friendly_name: Waveshare S3-ETH BLE Probe
  min_version: 2026.5.1   # slot-leak fix (esphome/esphome PR #16588)

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB        # ESP32-S3R8 + W25Q128 per Waveshare wiki
  framework:
    type: esp-idf

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 25MHz

api:

logger:
  level: INFO
  logs:
    bluetooth_proxy: INFO
    bluetooth_connection: INFO
    esp32_ble_client: WARN

ota:
  - platform: esphome

esp32_ble:
  max_connections: 4

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 4

# Diagnostics, added 2026-08-26 for TRA-1153 item 5.
#
# The ESP32 CPU and its 100Mbps link are the only constrained resources in this
# stack (the dev hosts are not), so any throughput claim about write-with-response
# has to be instrumented HERE rather than on a host. Before this, the device
# exposed two buttons and no sensors at all -- there was nothing to read.
#
# loop_time is the signal that matters: the main loop's period rises directly as
# the CPU is starved, so it measures the constrained resource instead of standing
# in for it. uptime is how you notice the arm that silently rebooted mid-run
# rather than reading its post-reboot numbers as data.
#
# NOTE: computing these costs loop time itself, so the instrument perturbs what it
# measures. Treat anything measured before this flash as a different arm, and stamp
# results with the firmware version (device_info returns it on every connect).
debug:
  update_interval: 10s

sensor:
  - platform: debug
    free:
      name: Heap Free
    loop_time:
      name: Loop Time
  - platform: uptime
    name: Uptime

button:
  - platform: safe_mode
    name: Safe Mode Boot
  - platform: factory_reset
    name: Factory reset
